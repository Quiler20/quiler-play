name: Build Quiler Play APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.quilerplay --project-name quiler_play --overwrite build_app

      - name: Add Quiler Play source files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.INTERNET" />' build_app/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiler-play-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
